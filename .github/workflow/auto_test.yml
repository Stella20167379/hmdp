name: SpringBoot Proj Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取当前仓库代码
      - name: Checkout code
        uses: actions/checkout@v6

      # 2. 准备 Java 17，并缓存 Maven 依赖
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 3. 从 parent pom 所在目录执行全部测试
      - name: Run tests
        run: mvn --batch-mode test